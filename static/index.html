<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>GT7</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #e8e8e8;
    --dim: #666;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #facc15;
    --cyan: #22d3ee;
    --magenta: #e879f9;
    --track: #1c1c1c;
    --panel: #111;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overscroll-behavior: none;
    min-height: 100vh;
  }
  body {
    padding: max(env(safe-area-inset-top), 12px) 14px max(env(safe-area-inset-bottom), 14px);
    max-width: 640px;
    margin: 0 auto;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--dim);
    margin-bottom: 12px;
    gap: 10px;
  }
  .car {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
  }
  .status {
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.08em;
    flex: none;
  }
  .status.ontrack { background: rgba(74,222,128,.18); color: var(--green); }
  .status.paused  { background: rgba(250,204,21,.18); color: var(--yellow); }
  .status.menu    { background: rgba(34,211,238,.18); color: var(--cyan); }
  .status.loading { background: rgba(250,204,21,.18); color: var(--yellow); }
  .status.offline { background: rgba(248,113,113,.18); color: var(--red); }
  .status.nodata  { background: rgba(102,102,102,.25); color: var(--dim); }

  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  .panel {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
  }
  .label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .speed-wrap { flex: 2; }
  .gear-wrap  { flex: 1; display: flex; flex-direction: column; align-items: flex-start; }

  .big-num {
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .speed-num { color: var(--cyan); font-size: 64px; }
  .gear-num  { color: var(--magenta); font-size: 88px; }
  .unit { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .suggest { font-size: 11px; color: var(--dim); margin-top: 4px; min-height: 1em; }

  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label { width: 44px; font-size: 11px; color: var(--dim); font-weight: 700; letter-spacing: 0.08em; }
  .bar-track {
    flex: 1;
    height: 14px;
    background: var(--track);
    border-radius: 7px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 7px;
    transition: width 60ms linear, background-color 120ms;
  }
  .bar-val { width: 52px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }

  .rpm-track { height: 18px; }
  /* No width transition on the RPM bar — the value updates at ~60 Hz,
     so CSS interpolation just lags behind and looks stuttery. */
  #rpm-fill { transition: background-color 120ms; }
  .rpm-readout {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--dim);
    margin-top: 6px; font-variant-numeric: tabular-nums;
  }

  .lap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lap-time {
    font-size: 24px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .lap-time.best { color: var(--green); }

  .footer {
    margin-top: 14px;
    font-size: 11px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }

  .divider {
    display: flex; align-items: center; gap: 10px;
    font-size: 10px; letter-spacing: 0.18em;
    color: var(--dim);
    margin: 18px 0 10px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: #1c1c1c;
  }

  .kv-val {
    font-size: 22px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .kv-val .unit {
    font-size: 11px; color: var(--dim);
    font-weight: 400; margin-left: 3px;
  }

  .tyre-grid {
    display: grid;
    grid-template-columns: 68px repeat(4, 1fr);
    gap: 6px 8px;
    margin-top: 6px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .tyre-grid .th, .tyre-grid .rh {
    font-size: 10px; color: var(--dim);
    letter-spacing: 0.1em;
  }
  .tyre-grid .th { text-align: center; }
  .tyre-grid > div:not(.th):not(.rh) { text-align: center; }

  .xyz {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .xyz .axis { color: var(--dim); margin-right: 4px; }

  .aids { display: flex; gap: 6px; flex: none; }
  .aid {
    padding: 3px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    background: rgba(250,204,21,.18); color: var(--yellow);
    visibility: hidden;
  }
  .aid.on { visibility: visible; }

  .coach-btn {
    padding: 3px 10px; border-radius: 999px; border: 0;
    font: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    background: rgba(232,121,249,.18); color: var(--magenta);
    flex: none; cursor: pointer;
  }
  .coach-btn.off { background: rgba(102,102,102,.25); color: var(--dim); }
  #names-btn { display: none; }
  /* keeps the screen on; must stay on screen or the phone pauses it */
  #keepawake {
    position: fixed; right: 0; bottom: 0; width: 2px; height: 2px;
    opacity: .01; pointer-events: none;
  }
  .coach-line {
    font-size: 14px; line-height: 1.35;
    color: var(--magenta);
    border-left: 3px solid var(--magenta);
    padding: 6px 10px; margin-bottom: 12px;
    background: var(--panel); border-radius: 0 10px 10px 0;
    transition: opacity 1s;
  }
  .coach-line.old { opacity: .45; }

  .track-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; margin-bottom: 8px;
  }
  .turn-now { font-size: 22px; font-weight: 700; }
  .turn-next { font-size: 12px; color: var(--dim); text-align: right; }
  #track-map { width: 100%; height: auto; display: block; }
  #track-map .line { fill: none; stroke: #333; stroke-linejoin: round; }
  #track-map .done { fill: none; stroke: var(--cyan); stroke-linejoin: round; opacity: .5; }

  .name-card { border: 1px solid var(--magenta); margin-bottom: 12px; }
  .name-card p { margin: 0 0 10px; font-size: 13px; line-height: 1.4; }
  .name-row { display: flex; gap: 8px; }
  .name-row input {
    flex: 1; min-width: 0;
    background: var(--track); color: var(--fg);
    border: 1px solid #333; border-radius: 8px;
    padding: 8px 10px; font: inherit; font-size: 14px;
  }
  .name-row button, .chip {
    background: rgba(232,121,249,.18); color: var(--magenta);
    border: 0; border-radius: 8px; padding: 8px 12px;
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 11px; font-weight: 400; padding: 5px 9px; border-radius: 999px; }
  #track-map .car  { fill: var(--magenta); }

  @media (min-width: 500px) {
    .speed-num { font-size: 88px; }
    .gear-num  { font-size: 112px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span id="status" class="status offline">OFFLINE</span>
    <span class="aids"><span id="tcs" class="aid">TCS</span><span id="asm" class="aid">ASM</span></span>
    <button id="coach-btn" class="coach-btn off">TAP FOR COACH</button>
    <button id="names-btn" class="coach-btn off">CORNERS</button>
    <span id="car" class="car">—</span>
  </div>

  <div id="coach-line" class="coach-line" style="display: none;"></div>
  <video id="keepawake" src="/keepawake.mp4" muted loop playsinline preload="auto"></video>

  <div class="row">
    <div class="panel speed-wrap">
      <div class="label">Speed</div>
      <div id="speed" class="big-num speed-num">0</div>
      <div class="unit">km/h</div>
    </div>
    <div class="panel gear-wrap">
      <div class="label">Gear</div>
      <div id="gear" class="big-num gear-num">N</div>
      <div id="sugg" class="suggest"></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom: 12px;">
    <div class="label">RPM</div>
    <div class="bar-track rpm-track"><div id="rpm-fill" class="bar-fill"></div></div>
    <div class="rpm-readout">
      <span id="rpm-cur">0 rpm</span>
      <span id="rpm-max">—</span>
    </div>
  </div>

  <div class="panel" style="margin-bottom: 12px;">
    <div class="bar-row" style="margin-bottom: 8px;">
      <div class="bar-label">THR</div>
      <div class="bar-track"><div id="thr-fill" class="bar-fill" style="background: var(--green);"></div></div>
      <div class="bar-val" id="thr-val">0%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">BRK</div>
      <div class="bar-track"><div id="brk-fill" class="bar-fill" style="background: var(--red);"></div></div>
      <div class="bar-val" id="brk-val">0%</div>
    </div>
  </div>

  <div class="lap-grid">
    <div class="panel">
      <div class="label">Last lap</div>
      <div id="last-lap" class="lap-time">—</div>
    </div>
    <div class="panel">
      <div class="label">Best lap</div>
      <div id="best-lap" class="lap-time best">—</div>
    </div>
  </div>

  <div class="footer">
    <span id="lap-count">Lap —/—</span>
    <span id="pkt">0 pkts</span>
  </div>

  <div id="name-card" class="panel name-card" style="margin-top: 12px; display: none;">
    <div class="label">New track recorded</div>
    <p id="name-msg"></p>
    <div class="name-row">
      <input id="name-input" list="course-list" placeholder="Track name" autocomplete="off">
      <button id="name-save">Save</button>
    </div>
    <div id="name-chips" class="chips"></div>
    <datalist id="course-list"></datalist>
  </div>

  <div id="track-panel" class="panel" style="margin-top: 12px; display: none;">
    <div class="track-head">
      <div>
        <div class="label" id="track-name">Track</div>
        <div id="turn-now" class="turn-now">—</div>
      </div>
      <div class="turn-next">
        <div id="lap-dist">—</div>
        <div id="turn-next">—</div>
      </div>
    </div>
    <svg id="track-map" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="divider">DETAILS</div>

  <div class="row">
    <div class="panel" style="flex:1;">
      <div class="label">Fuel</div>
      <div class="kv-val"><span id="fuel">—</span><span class="unit">L / <span id="fuel-cap">—</span> L</span></div>
    </div>
    <div class="panel" style="flex:1;">
      <div class="label">Boost</div>
      <div class="kv-val"><span id="boost">—</span><span class="unit">bar</span></div>
    </div>
  </div>

  <div class="row">
    <div class="panel" style="flex:1;">
      <div class="label">Water</div>
      <div class="kv-val"><span id="water">—</span><span class="unit">°C</span></div>
    </div>
    <div class="panel" style="flex:1;">
      <div class="label">Oil</div>
      <div class="kv-val"><span id="oil">—</span><span class="unit">°C</span></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom: 12px;">
    <div class="label">Tyres</div>
    <div class="tyre-grid">
      <div></div>
      <div class="th">FL</div><div class="th">FR</div><div class="th">RL</div><div class="th">RR</div>
      <div class="rh">Temp °C</div>
      <div id="tt-0">—</div><div id="tt-1">—</div><div id="tt-2">—</div><div id="tt-3">—</div>
      <div class="rh">Susp m</div>
      <div id="sh-0">—</div><div id="sh-1">—</div><div id="sh-2">—</div><div id="sh-3">—</div>
      <div class="rh">RPS</div>
      <div id="rps-0">—</div><div id="rps-1">—</div><div id="rps-2">—</div><div id="rps-3">—</div>
      <div class="rh">Slip</div>
      <div id="slip-0">—</div><div id="slip-1">—</div><div id="slip-2">—</div><div id="slip-3">—</div>
    </div>
  </div>

  <div class="panel" style="margin-bottom: 12px;">
    <div class="label">Position</div>
    <div class="xyz">
      <span><span class="axis">X</span><span id="pos-x">—</span></span>
      <span><span class="axis">Y</span><span id="pos-y">—</span></span>
      <span><span class="axis">Z</span><span id="pos-z">—</span></span>
    </div>
    <div class="label" style="margin-top:10px;">Velocity</div>
    <div class="xyz">
      <span><span class="axis">X</span><span id="vel-x">—</span></span>
      <span><span class="axis">Y</span><span id="vel-y">—</span></span>
      <span><span class="axis">Z</span><span id="vel-z">—</span></span>
    </div>
  </div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const fmtTime = (ms) => {
    if (ms == null || ms < 0) return "—";
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const r = ms % 1000;
    return `${m}:${String(s).padStart(2, "0")}.${String(r).padStart(3, "0")}`;
  };
  const fmtGear = (g) => (g === 0 ? "R" : g === 15 ? "N" : String(g));
  const rpmColor = (t) =>
    t.max_rpm > 0 && t.rpm >= t.max_rpm ? "var(--red)"
    : t.shift_rpm > 0 && t.rpm >= t.shift_rpm ? "var(--yellow)"
    : "var(--green)";
  const slipColor = (s) =>
    Math.abs(s - 1) > 0.10 ? "var(--red)"
    : Math.abs(s - 1) > 0.04 ? "var(--yellow)" : "var(--green)";

  let lastPacketAt = 0;
  let wsConnected = false;

  function setStatus(cls, text) {
    const el = $("status");
    el.className = "status " + cls;
    el.textContent = text;
  }

  function applyStatus(t) {
    if (t.loading)       setStatus("loading", "LOADING");
    else if (t.paused)   setStatus("paused",  "PAUSED");
    else if (t.on_track) setStatus("ontrack", "ON TRACK");
    else                 setStatus("menu",    "MENU");
  }

  let lastT = null;
  function update(t) {
    lastT = t;
    lastPacketAt = Date.now();
    applyStatus(t);
    $("car").textContent = t.car_name || "—";

    $("speed").textContent = t.speed_kmh.toFixed(0);

    const gStr = fmtGear(t.gear);
    $("gear").textContent = gStr;
    const sg = fmtGear(t.sugg_gear);
    $("sugg").textContent = sg === gStr || t.sugg_gear === 0 ? "" : `suggest ${sg}`;

    const ratio = t.max_rpm > 0 ? Math.min(t.rpm / t.max_rpm, 1) : 0;
    const fill = $("rpm-fill");
    fill.style.width = (ratio * 100) + "%";
    fill.style.backgroundColor = rpmColor(t);
    $("rpm-cur").textContent = Math.round(t.rpm) + " rpm";
    $("rpm-max").textContent = Math.round(t.max_rpm) + " max";

    $("thr-fill").style.width = Math.min(t.throttle_pct, 100) + "%";
    $("thr-val").textContent = t.throttle_pct.toFixed(0) + "%";
    $("brk-fill").style.width = Math.min(t.brake_pct, 100) + "%";
    $("brk-val").textContent = t.brake_pct.toFixed(0) + "%";

    $("last-lap").textContent = fmtTime(t.last_lap_ms);
    $("best-lap").textContent = fmtTime(t.best_lap_ms);
    $("lap-count").textContent =
      `Lap ${t.lap_count}/${t.total_laps > 0 ? t.total_laps : "—"}`;
    $("pkt").textContent =
      `${t.pkt_count} pkts` + (t.pkt_dropped ? ` · ${t.pkt_dropped} lost` : "");
    $("tcs").classList.toggle("on", t.tcs_active);
    $("asm").classList.toggle("on", t.asm_active);
    updateTrack(t);

    const tempColor = (v) =>
      v >= 100 ? "var(--red)" : v >= 80 ? "var(--yellow)" : "var(--green)";

    $("fuel").textContent = t.fuel_l.toFixed(1);
    $("fuel-cap").textContent = t.fuel_cap_l.toFixed(1);
    $("boost").textContent = (t.boost_bar >= 0 ? "+" : "") + t.boost_bar.toFixed(2);

    const water = $("water");
    water.textContent = t.water_temp_c.toFixed(0);
    water.style.color = tempColor(t.water_temp_c);
    const oil = $("oil");
    oil.textContent = t.oil_temp_c.toFixed(0);
    oil.style.color = tempColor(t.oil_temp_c);

    for (let i = 0; i < 4; i++) {
      const tt = $(`tt-${i}`);
      tt.textContent = t.tyre_temp[i].toFixed(0);
      tt.style.color = tempColor(t.tyre_temp[i]);
      $(`sh-${i}`).textContent = t.susp_height[i].toFixed(3);
      $(`rps-${i}`).textContent = t.wheel_rps[i].toFixed(1);
      const sl = $(`slip-${i}`);
      if (t.wheel_slip) {
        sl.textContent = t.wheel_slip[i].toFixed(2);
        sl.style.color = slipColor(t.wheel_slip[i]);
      } else {
        sl.textContent = "—";
        sl.style.color = "";
      }
    }

    $("pos-x").textContent = t.pos[0].toFixed(1);
    $("pos-y").textContent = t.pos[1].toFixed(1);
    $("pos-z").textContent = t.pos[2].toFixed(1);
    $("vel-x").textContent = t.vel[0].toFixed(2);
    $("vel-y").textContent = t.vel[1].toFixed(2);
    $("vel-z").textContent = t.vel[2].toFixed(2);
  }

  // ---- track map ----
  const SVG_NS = "http://www.w3.org/2000/svg";
  let tracks = {};
  let drawn = null;       // id of the track currently in the SVG
  let mapEls = null;
  let lastFetch = 0;

  function loadTracks() {
    lastFetch = Date.now();
    return fetch("/tracks").then((r) => r.json()).then((d) => {
      tracks = d;
      const unnamed = Object.values(d).find((tr) => !tr.named);
      if (unnamed) askName(unnamed);
    }).catch(() => {});
  }
  loadTracks();

  function drawTrack(id) {
    const tr = tracks[id];
    if (!tr) {   // not loaded yet, or recorded since the page opened
      if (Date.now() - lastFetch > 3000) loadTracks();
      return;
    }
    const svg = $("track-map");
    svg.innerHTML = "";
    drawn = id;
    const pts = tr.points;
    const xs = pts.map((p) => p[0]), zs = pts.map((p) => p[1]);
    const pad = 60;
    const minX = Math.min(...xs) - pad, minZ = Math.min(...zs) - pad;
    svg.setAttribute("viewBox",
      `${minX} ${minZ} ${Math.max(...xs) + pad - minX} ${Math.max(...zs) + pad - minZ}`);
    const d = "M" + pts.map((p) => `${p[0].toFixed(0)},${p[1].toFixed(0)}`).join("L") + "Z";
    const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs));
    const mk = (tag, attrs) => {
      const el = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      svg.appendChild(el);
      return el;
    };
    mk("path", { d, class: "line", "stroke-width": span / 150 });
    const done = mk("path", { d, class: "done", pathLength: 1000, "stroke-width": span / 150 });
    const car = mk("circle", { r: span / 55, class: "car" });
    mapEls = { done, car };
  }

  function updateTrack(t) {
    const tp = t.track_pos;
    const panel = $("track-panel");
    if (!tp) { panel.style.display = "none"; return; }
    panel.style.display = "";
    if (drawn !== tp.track_id) drawTrack(tp.track_id);

    $("track-name").textContent = tp.track;
    $("turn-now").textContent = tp.turn ? tp.turn.label : "Straight";
    $("lap-dist").textContent = (tp.lap_dist_m / 1000).toFixed(2) + " km";
    const n = tp.next_turn;
    $("turn-next").textContent = n
      ? `next ${n.label} ${n.dir} · ${Math.round(tp.next_turn_in_m)} m` : "";

    if (mapEls) {
      mapEls.car.setAttribute("cx", t.pos[0]);
      mapEls.car.setAttribute("cy", t.pos[2]);
      // Light up the lap so far, from start/finish to the car. The path is
      // drawn from wherever the recording began, so shift by start_frac; a
      // dash pattern exactly one lap long wraps past the path's end for free.
      const f = Math.max(0, Math.min(1, tp.lap_frac)) * 1000;
      mapEls.done.setAttribute("stroke-dasharray", `${f} ${1000 - f}`);
      mapEls.done.setAttribute("stroke-dashoffset", -tp.start_frac * 1000);
    }
  }

  // ---- naming recorded tracks ----
  let naming = null;   // id of the track the card is asking about
  let coursesLoaded = false;

  function askName(tr) {
    naming = tr.id;
    $("name-msg").textContent =
      `You drove a lap of a track I didn't know (${(tr.length_m / 1000).toFixed(2)} km), ` +
      `so I saved it. What is it?`;
    $("name-input").value = "";
    const chips = $("name-chips");
    chips.innerHTML = "";
    for (const s of tr.suggestions || []) {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = s;
      b.onclick = () => { $("name-input").value = s; };
      chips.appendChild(b);
    }
    $("name-card").style.display = "";
    if (!coursesLoaded) {
      coursesLoaded = true;
      fetch("/courses").then((r) => r.json()).then((names) => {
        $("course-list").innerHTML = names.map((n) => {
          const o = document.createElement("option");
          o.value = n;
          return o.outerHTML;
        }).join("");
      }).catch(() => { coursesLoaded = false; });
    }
  }

  $("name-save").addEventListener("click", () => {
    const name = $("name-input").value.trim();
    if (!naming || !name) return;
    fetch(`/tracks/${naming}/name`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name }),
    }).then((r) => {
      if (!r.ok) return;
      $("name-card").style.display = "none";
      naming = null;
      drawn = null;
      loadTracks();
    }).catch(() => {});
  });

  // ---- voice coach ----
  // Phones only allow audio after a tap, so the first tap plays a silent
  // clip on our <audio> element; later callouts can then play on their own.
  const voice = new Audio();
  const coachQueue = [];
  let coachOn = false;
  let coachFade = null;

  function silentWav() {
    const n = 800, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 16000, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  function setCoach(on) {
    coachOn = on;
    const b = $("coach-btn");
    b.classList.toggle("off", !on);
    b.textContent = on ? "COACH ON" : "COACH OFF";
    if (!on) { voice.pause(); coachQueue.length = 0; }
  }

  $("coach-btn").addEventListener("click", () => {
    if (!coachOn && !voice.dataset.unlocked) {
      voice.src = silentWav();
      voice.play().then(() => { voice.dataset.unlocked = "1"; }).catch(() => {});
    }
    setCoach(!coachOn);
  });

  let playingPriority = false;
  function playNext() {
    if (!coachOn || !voice.paused || !coachQueue.length) return;
    const next = coachQueue.shift();
    playingPriority = next.priority;
    voice.src = "data:audio/mpeg;base64," + next.audio;
    voice.play().catch(() => {});
  }
  voice.addEventListener("ended", playNext);

  // Corner names jump the queue and cut off other coaching (not each other).
  function coachSay(msg) {
    const line = $("coach-line");
    line.textContent = msg.text;
    line.style.display = "";
    line.classList.remove("old");
    clearTimeout(coachFade);
    coachFade = setTimeout(() => line.classList.add("old"), 8000);
    if (!coachOn || !msg.audio) return;
    const clip = { audio: msg.audio, priority: !!msg.priority };
    if (clip.priority) {
      const names = coachQueue.filter(c => c.priority);
      coachQueue.length = 0;
      coachQueue.push(...names, clip);
      if (!playingPriority) voice.pause();
    } else {
      coachQueue.push(clip);
    }
    playNext();
  }

  // Corner-name callouts (for learning a track) can be switched on and off;
  // the server holds the setting so every open dashboard agrees.
  let ws = null;
  function showCoachState(msg) {
    const b = $("names-btn");
    b.style.display = msg.available ? "" : "none";
    b.classList.toggle("off", !msg.corner_names);
    b.textContent = msg.corner_names ? "CORNERS ON" : "CORNERS OFF";
    b.dataset.on = msg.corner_names ? "1" : "";
  }
  $("names-btn").addEventListener("click", () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "corner_names", on: !$("names-btn").dataset.on }));
    }
  });

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => { wsConnected = true; };
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === "coach") coachSay(msg);
        else if (msg.type === "coach_state") showCoachState(msg);
        else if (msg.type === "track_recorded") loadTracks();
        else update(msg);
      }
      catch (err) { console.error(err); }
    };
    ws.onclose = () => {
      wsConnected = false;
      setStatus("offline", "OFFLINE");
      setTimeout(connect, 1000);
    };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }

  // stale-data detection: if we haven't heard from PS5 in >3s, show NO DATA
  setInterval(() => {
    if (!wsConnected) return;
    if (Date.now() - lastPacketAt > 3000) {
      setStatus("nodata", "NO DATA");
    } else if (lastT) {
      applyStatus(lastT);
    }
  }, 500);

  // Keep the screen on. The Wake Lock API only exists on https or
  // localhost, so over plain http on the LAN we fall back to playing a tiny
  // silent looping video, which phones treat as "watching something".
  // Either needs a tap first, and is lost when the page is hidden.
  let wakeLock = null;
  async function keepAwake() {
    if ("wakeLock" in navigator) {
      try {
        if (wakeLock === null) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        }
        return;
      } catch (_) { /* not allowed: fall through to the video */ }
    }
    $("keepawake").play().catch(() => {});
  }
  document.addEventListener("click", keepAwake);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") keepAwake();
  });

  connect();
})();
</script>
</body>
</html>
